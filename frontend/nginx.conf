# nginx для продакшн-сборки фронтенда.
# Раздаёт статику SPA и проксирует API на backend-контейнер.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Хешированные ассеты можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth/    { proxy_pass http://backend; }
    location /users/   { proxy_pass http://backend; }
    location /posts/   { proxy_pass http://backend; }
    location /comments/ { proxy_pass http://backend; }
    location /groups/  { proxy_pass http://backend; }
    location /profile/ { proxy_pass http://backend; }
    location /follow/  { proxy_pass http://backend; }
    location /media/   { proxy_pass http://backend; }
    location /uploads/ { proxy_pass http://backend; }
    location /health   { proxy_pass http://backend; }

    location ~ ^/(auth|users|posts|comments|groups|profile|follow|media|uploads|health) {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
