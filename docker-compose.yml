
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # миграции, alembic revisions, uploads — всё синхронизировано
      - ./backend:/app

      - /app/__pycache__
      - /app/app/__pycache__
      - /app/app/routers/__pycache__
      - /app/app/services/__pycache__
      - /app/app/repositories/__pycache__
      - /app/app/core/__pycache__
      - /app/app/utils/__pycache__
      - /app/alembic/__pycache__
      - /app/alembic/versions/__pycache__

      - /app/venv
      - /app/venv2
      - /app/.venv
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: