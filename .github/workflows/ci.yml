name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: livez_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-in-production-32b
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/livez_test
      DEBUG: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Линтер (ruff)
        run: ruff check .

      - name: Формат (ruff format)
        run: ruff format --check .

      - name: Типы (mypy)
        run: mypy app
        continue-on-error: true

      - name: Миграции применяются на чистую БД
        run: alembic upgrade head

      - name: Нет расхождений моделей и миграций
        run: alembic check

      - name: Тесты
        run: pytest -q

  frontend:
    name: Frontend (lint, format, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - name: Линтер (oxlint)
        run: npm run lint

      - name: Формат (prettier)
        run: npm run format:check

      - name: Сборка
        run: npm run build

  docker:
    name: Docker образы собираются
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Собрать backend
        run: docker build -t livez-backend ./backend

      - name: Собрать frontend
        run: docker build -t livez-frontend ./frontend
