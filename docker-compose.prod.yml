# LiveZ — продакшн.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Отличия от dev-конфигурации:
#   - исходники не монтируются, код внутри образа
#   - фронтенд раздаётся nginx, а не dev-сервером Vite
#   - DEBUG=false, cookie Secure (включайте только при HTTPS)
#   - наружу смотрят только nginx и (опционально) backend
#
# Перед запуском проверьте .env в корне и backend/.env:
#   SECRET_KEY        — случайный, не из примера
#   COOKIE_SECURE     — true, если сайт открывается по HTTPS
#   CORS_ORIGINS      — конкретный домен фронта

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: livez_backend
    # Наружу backend не публикуем: доступ идёт через nginx фронтенда.
    # Раскомментируйте для отладки.
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEBUG: "false"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: livez_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: livez_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  backend_uploads:
